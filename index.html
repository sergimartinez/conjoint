<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Encuesta sobre cómo valoramos distintos países</title>
<style>
  :root { --ink:#1f2937; --muted:#6b7280; --line:#d1d5db; --accent:#1d4ed8; --bg:#f9fafb; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         color:var(--ink); background:var(--bg); line-height:1.5; }
  main { max-width: 720px; margin: 0 auto; padding: 20px 14px 56px; }
  h1 { font-size: 1.4rem; margin: 0 0 12px; }
  h2 { font-size: 1.05rem; margin: 22px 0 8px; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); font-size: .9rem; }
  .bar { height: 6px; background: #e5e7eb; border-radius: 3px; margin-bottom: 20px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); transition: width .3s; }
  table { width: 100%; border-collapse: collapse; background: #fff; margin: 12px 0 18px; table-layout: fixed; }
  th, td { border: 1px solid var(--line); padding: 8px 6px; text-align: center; font-size: .9rem; vertical-align: middle; }
  thead th { background: #eef2ff; }
  tbody th { text-align: left; background: #f3f4f6; font-weight: 600; width: 24%; }
  .group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .opt { flex: 1 1 auto; min-width: 48px; padding: 12px 14px; font-size: 1rem; background: #fff;
         border: 2px solid var(--line); border-radius: 10px; cursor: pointer; color: var(--ink); text-align: center; }
  .opt.sel { border-color: var(--accent); background: #eff6ff; font-weight: 600; }
  .group.scale .opt { flex: 0 0 calc(25% - 6px); }
  .primary { width: 100%; padding: 14px; font-size: 1.05rem; font-weight: 600; color: #fff;
             background: var(--accent); border: 0; border-radius: 10px; cursor: pointer; margin-top: 16px; }
  .primary:disabled { background: #9ca3af; cursor: not-allowed; }
  .box { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 12px 0; }
  .ejemplo { border-left: 5px solid #9ca3af; }
  .note { background: #fef3c7; border: 1px solid #fcd34d; padding: 10px; border-radius: 8px;
          font-size: .85rem; margin-top: 16px; }
  figure { margin: 16px 0; padding: 0; }
  figure img { width: 100%; height: auto; display: block; background: #fff; border: 1px solid var(--line); }
  figcaption { font-size: .82rem; color: var(--muted); margin-top: 8px; }
  .ref { font-size: .85rem; color: var(--ink); padding-left: 2em; text-indent: -2em; }
  pre { white-space: pre-wrap; word-break: break-all; font-size: .72rem; background:#fff;
        border:1px solid var(--line); padding:8px; border-radius:8px; }
</style>
</head>
<body>
<main id="app"></main>

<script>
/* ============ CONFIGURACIÓN ============ */
const CONFIG = {
  // URL de la aplicación web de Google Apps Script (termina en /exec).
  // Si se deja vacío, la página funciona en modo prueba y no guarda nada.
  endpoint: "",
  nTasks: 5,
  // Renta mensual media de referencia en España, en euros (Ferrer et al. 2025 usan 2400 €).
  rentaMediaEUR: 2400,
  // Texto opcional de contacto que aparece en la pantalla final (por ejemplo un correo).
  contacto: ""
};

/* ============ ATRIBUTOS Y NIVELES (Tabla 1 de Ferrer et al. 2025, en castellano) ============ */
const MULTIPLOS_RENTA = [0.8, 0.9, 1, 1.1, 1.25];
function fmtEUR(x) {
  const n = Math.round(x);
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ".") + " € al mes";
}
const ATTRS = [
  { key: "elecciones", label: "Elecciones", levels: [
    { code: "libres",    text: "Los ciudadanos eligen a sus líderes en elecciones libres y justas" },
    { code: "no_libres", text: "Los ciudadanos acuden a las urnas, pero las elecciones no son ni libres ni justas" } ] },
  { key: "medios", label: "Medios de comunicación", levels: [
    { code: "critica_libre", text: "Los medios pueden criticar abiertamente al gobierno" },
    { code: "censura",       text: "El gobierno censura los medios que son demasiado críticos" } ] },
  { key: "protestas", label: "Protestas y manifestaciones", levels: [
    { code: "libres",       text: "Las organizaciones que se oponen a las políticas del gobierno pueden convocar manifestaciones sin ninguna restricción" },
    { code: "restringidas", text: "El gobierno restringe las manifestaciones promovidas por organizaciones contrarias a sus políticas" } ] },
  { key: "jueces", label: "Jueces y tribunales", levels: [
    { code: "acata",  text: "El gobierno acata las sentencias de los tribunales, incluso cuando van contra sus intereses" },
    { code: "ignora", text: "El gobierno ignora las sentencias de los tribunales que van contra sus intereses" } ] },
  { key: "parlamento", label: "Parlamento", levels: [
    { code: "control",  text: "Las decisiones del gobierno están siempre sujetas al control del parlamento del país" },
    { code: "se_salta", text: "Cuando hay que tomar decisiones con rapidez, el gobierno se salta al parlamento del país" } ] },
  { key: "leyes", label: "Leyes", levels: [
    { code: "cumple", text: "El gobierno cumple la ley, incluso ante problemas sociales y políticos urgentes" },
    { code: "fuerza", text: "El gobierno fuerza la ley para resolver problemas sociales y políticos urgentes" } ] },
  { key: "renta", label: "Su renta mensual", levels: MULTIPLOS_RENTA.map(m => (
    { code: m, text: fmtEUR(m * CONFIG.rentaMediaEUR) })) }
];
const ATTR = Object.fromEntries(ATTRS.map(a => [a.key, a]));

/* ============ UTILIDADES ============ */
function randInt(n) {
  if (window.crypto && crypto.getRandomValues) {
    const buf = new Uint32Array(1);
    const limit = Math.floor(4294967296 / n) * n;
    do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
    return buf[0] % n;
  }
  return Math.floor(Math.random() * n);
}
function shuffle(arr) {
  const b = arr.slice();
  for (let i = b.length - 1; i > 0; i--) {
    const j = randInt(i + 1);
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}
function drawProfile() {            // todos los niveles con la misma probabilidad y sin restricciones
  const p = {};
  ATTRS.forEach(a => { p[a.key] = a.levels[randInt(a.levels.length)]; });
  return p;
}
function uid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}

const params = new URLSearchParams(location.search);
const state = {
  id: uid(),
  src: params.get("src") || "",
  order: shuffle(ATTRS.map(a => a.key)),   // orden de atributos, aleatorio por persona y fijo durante toda la encuesta
  task: 0,
  startedAt: Date.now(),
  demoLog: []
};

const app = document.getElementById("app");
function clear() { app.innerHTML = ""; window.scrollTo(0, 0); }
function node(html) {
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstChild;
}
function progress(frac) {
  return node('<div class="bar"><div style="width:' + Math.round(frac * 100) + '%"></div></div>');
}
function group(options, onSelect, cls) {
  const wrap = document.createElement("div");
  wrap.className = "group " + (cls || "");
  options.forEach(o => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "opt";
    b.textContent = o.label;
    b.addEventListener("click", () => {
      Array.from(wrap.children).forEach(c => c.classList.remove("sel"));
      b.classList.add("sel");
      onSelect(o.value);
    });
    wrap.appendChild(b);
  });
  return wrap;
}
function scale11() {
  const s = [];
  for (let i = 0; i <= 10; i++) s.push({ label: String(i), value: i });
  return s;
}
function tableHTML(A, B, order) {
  const rows = order.map(k => "<tr><th scope='row'>" + ATTR[k].label + "</th><td>" + A[k].text +
    "</td><td>" + B[k].text + "</td></tr>").join("");
  return "<table><thead><tr><th></th><th>País A</th><th>País B</th></tr></thead><tbody>" + rows + "</tbody></table>";
}

/* ============ ENVÍO DE DATOS ============ */
function pendingList() {
  try { return JSON.parse(localStorage.getItem("pending_rows_democracia") || "[]"); } catch (e) { return []; }
}
function savePending(list) {
  try { localStorage.setItem("pending_rows_democracia", JSON.stringify(list)); } catch (e) {}
}
function post(row) {
  return fetch(CONFIG.endpoint, {
    method: "POST", mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(row), keepalive: true
  });
}
function send(row) {
  if (!CONFIG.endpoint) { state.demoLog.push(row); console.log("MODO PRUEBA", row); return; }
  const queue = pendingList();
  queue.push(row);
  savePending(queue);
  flush();
}
async function flush() {
  let queue = pendingList();
  while (queue.length) {
    try { await post(queue[0]); } catch (e) { return; }
    queue = pendingList();
    queue.shift();
    savePending(queue);
  }
}
window.addEventListener("online", () => { if (CONFIG.endpoint) flush(); });

/* ============ PANTALLAS ============ */
function showConsent() {
  clear();
  app.appendChild(progress(0));
  app.appendChild(node(
    '<div><h1>Bienvenido/a y gracias por participar</h1>' +
    '<p>Esta encuesta forma parte de una investigación académica. Responder lleva unos 5 minutos ' +
    'y no hay respuestas correctas ni incorrectas.</p>' +
    '<p>La participación es voluntaria y anónima. No se recogen nombres, correos ni direcciones IP. ' +
    'Los datos se usarán solo con fines de investigación y se presentarán de forma agregada. ' +
    'Puede abandonar en cualquier momento cerrando esta página.</p>' +
    '<p>Al pulsar el botón confirma que tiene 18 años o más y que acepta participar ' +
    'voluntariamente.</p></div>'));
  const btn = node('<button class="primary" type="button">Acepto y quiero continuar</button>');
  btn.addEventListener("click", showBriefing);
  app.appendChild(btn);
  if (!CONFIG.endpoint) {
    app.appendChild(node('<div class="note">Modo prueba. No hay servidor configurado, así que las ' +
      'respuestas no se guardan.</div>'));
  }
}

function showBriefing() {
  clear();
  app.appendChild(progress(0.05));
  app.appendChild(node(
    '<div><h1>Cómo funciona</h1>' +
    '<p>Los países pueden diferir en muchas características, por ejemplo en cómo funcionan sus instituciones ' +
    'o en cuánto dinero ganaría usted si viviera allí.</p>' +
    '<p>Le vamos a mostrar <b>' + CONFIG.nTasks + ' comparaciones</b>. En cada una verá <b>dos países hipotéticos</b> ' +
    '(País A y País B) descritos por varias características. No son países reales y sus características se han ' +
    'combinado al azar. Algunas combinaciones pueden resultarle poco habituales. Le pedimos que responda igualmente ' +
    'como si fueran reales.</p>' +
    '<p>En cada comparación le pediremos que <b>elija el país en el que preferiría vivir</b> y que ' +
    '<b>puntúe cada país</b> de 0 (muy malo) a 10 (muy bueno). La «renta mensual» es lo que usted ganaría al mes ' +
    'si viviera en ese país.</p></div>'));

  // Ejemplo ilustrativo y fijo, no forma parte del experimento
  const ejA = { elecciones: ATTR.elecciones.levels[0], medios: ATTR.medios.levels[1], protestas: ATTR.protestas.levels[0],
                jueces: ATTR.jueces.levels[0], parlamento: ATTR.parlamento.levels[1], leyes: ATTR.leyes.levels[0],
                renta: ATTR.renta.levels[3] };
  const ejB = { elecciones: ATTR.elecciones.levels[1], medios: ATTR.medios.levels[0], protestas: ATTR.protestas.levels[1],
                jueces: ATTR.jueces.levels[1], parlamento: ATTR.parlamento.levels[0], leyes: ATTR.leyes.levels[1],
                renta: ATTR.renta.levels[1] };
  app.appendChild(node('<div class="box ejemplo"><p><b>Ejemplo ilustrativo</b></p>' +
    '<p class="muted">Así se verá cada comparación. Este ejemplo no es una pregunta y no se guarda.</p>' +
    tableHTML(ejA, ejB, ATTRS.map(a => a.key)) + '</div>'));

  const btn = node('<button class="primary" type="button">Empezar</button>');
  btn.addEventListener("click", showTask);
  app.appendChild(btn);
}

function showTask() {
  clear();
  const t = state.task + 1;
  app.appendChild(progress(0.1 + 0.85 * (state.task / CONFIG.nTasks)));
  const A = drawProfile(), B = drawProfile();
  const ans = { choice: null, pA: null, pB: null };

  app.appendChild(node(
    "<div><h1>Comparación " + t + " de " + CONFIG.nTasks + "</h1>" +
    "<p>Estos son dos países hipotéticos. Lea con atención sus características.</p>" +
    tableHTML(A, B, state.order) + "</div>"));

  app.appendChild(node("<h2>Si pudiera elegir, ¿en cuál de estos dos países preferiría vivir?</h2>"));
  app.appendChild(group([
    { label: "País A", value: "A" }, { label: "País B", value: "B" }
  ], v => { ans.choice = v; check(); }));

  app.appendChild(node("<h2>¿Cómo valora el País A?</h2>" +
    "<p class='muted'>0 = muy malo, 10 = muy bueno</p>"));
  app.appendChild(group(scale11(), v => { ans.pA = v; check(); }, "scale"));

  app.appendChild(node("<h2>¿Cómo valora el País B?</h2>" +
    "<p class='muted'>0 = muy malo, 10 = muy bueno</p>"));
  app.appendChild(group(scale11(), v => { ans.pB = v; check(); }, "scale"));

  const last = t === CONFIG.nTasks;
  const next = node('<button class="primary" type="button" disabled>' +
    (last ? "Terminar" : "Siguiente") + "</button>");
  app.appendChild(next);
  function check() { next.disabled = !(ans.choice && ans.pA !== null && ans.pB !== null); }

  next.addEventListener("click", () => {
    next.disabled = true;
    const row = {
      respondent_id: state.id,
      tarea: t,
      timestamp: new Date().toISOString(),
      fuente: state.src,
      orden_atributos: state.order.join(">"),
      eleccion: ans.choice,
      puntuacion_A: ans.pA,
      puntuacion_B: ans.pB,
      segundos_desde_inicio: Math.round((Date.now() - state.startedAt) / 1000)
    };
    ATTRS.forEach(a => { row["A_" + a.key] = A[a.key].code; row["B_" + a.key] = B[a.key].code; });
    send(row);
    state.task += 1;
    if (state.task >= CONFIG.nTasks) showEnd(); else showTask();
  });
}

    "<p>Cada símbolo es un país del estudio y cada línea es su intervalo de confianza. En el panel izquierdo, un valor " +
    "negativo indica que ese rasgo reduce la probabilidad de que el país sea elegido respecto a la categoría de " +
    "referencia, indicada entre paréntesis. El panel derecho hace lo mismo con la puntuación de 0 a 10. La renta " +
    "aparece normalizada, de modo que una unidad corresponde a la renta mensual media de cada país.</p>" +
    "<p>Según los autores, que un país no celebre elecciones libres reduce su probabilidad de ser elegido entre 40 y " +
